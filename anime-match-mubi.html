<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A0A0C;
    --bg-elev: #151518;
    --bg-elev-2: #1D1D21;
    --text: #F4F4F2;
    --text-dim: #9C9CA3;
    --text-faint: #6B6B72;
    --accent: #4B4EFF;
    --accent-hover: #6669FF;
    --line: rgba(255,255,255,0.08);
    --pass: #FF5C5C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Archivo', sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  ::-webkit-scrollbar{height:0; width:0;}

  /* Top bar */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    padding:18px 22px;
    position:sticky;
    top:0;
    background:linear-gradient(to bottom, rgba(10,10,12,0.95), rgba(10,10,12,0));
    z-index:40;
  }
  .logo{
    font-weight:800;
    font-size:1.05rem;
    letter-spacing:0.5px;
    display:flex;
    align-items:center;
    gap:8px;
    white-space:nowrap;
  }
  .logo .dots{
    display:grid;
    grid-template-columns:repeat(3,4px);
    gap:2px;
  }
  .logo .dots span{width:4px; height:4px; border-radius:50%; background:var(--accent);}
  .mood-scroll{
    display:flex;
    gap:8px;
    overflow-x:auto;
    flex:1;
    padding:2px 0;
  }
  .chip{
    font-family:'Archivo', sans-serif;
    font-weight:600;
    font-size:0.72rem;
    letter-spacing:0.4px;
    text-transform:uppercase;
    white-space:nowrap;
    padding:8px 14px;
    border-radius:100px;
    border:1px solid var(--line);
    background:var(--bg-elev);
    color:var(--text-dim);
    cursor:pointer;
    transition:all 0.15s ease;
  }
  .chip:hover{border-color:var(--text-faint); color:var(--text);}
  .chip.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .matches-btn{
    display:flex;
    align-items:center;
    gap:6px;
    background:transparent;
    border:1px solid var(--line);
    color:var(--text);
    font-family:'Archivo', sans-serif;
    font-weight:600;
    font-size:0.72rem;
    letter-spacing:0.4px;
    padding:8px 14px;
    border-radius:100px;
    cursor:pointer;
    white-space:nowrap;
  }

  .filter-bar{
    display:flex;
    gap:10px;
    align-items:center;
    padding:0 22px 18px;
    flex-wrap:wrap;
  }
  select{
    font-family:'Archivo', sans-serif;
    font-size:0.75rem;
    background:var(--bg-elev);
    color:var(--text-dim);
    border:1px solid var(--line);
    border-radius:6px;
    padding:7px 10px;
  }
  .toggle-wrap{
    display:flex; align-items:center; gap:6px;
    font-size:0.75rem; color:var(--text-dim);
    cursor:pointer;
  }
  .toggle-wrap input{accent-color:var(--accent);}
  .go-btn{
    font-family:'Archivo', sans-serif;
    font-weight:700;
    font-size:0.72rem;
    letter-spacing:0.5px;
    text-transform:uppercase;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:6px;
    padding:9px 16px;
    cursor:pointer;
  }
  .go-btn:hover{background:var(--accent-hover);}

  /* Hero */
  .hero{
    position:relative;
    width:100%;
    height:52vh;
    min-height:340px;
    max-height:520px;
    background-size:cover;
    background-position:center 20%;
    background-color:var(--bg-elev);
    display:flex;
    align-items:flex-end;
    overflow:hidden;
  }
  .hero::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(to top, rgba(10,10,12,1) 0%, rgba(10,10,12,0.55) 45%, rgba(10,10,12,0.05) 75%);
  }
  .hero-content{
    position:relative;
    z-index:2;
    padding:0 22px 26px;
    max-width:640px;
  }
  .hero-eyebrow{
    font-size:0.7rem;
    font-weight:700;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--accent-hover);
    margin-bottom:8px;
  }
  .hero-title{
    font-size:2.1rem;
    font-weight:800;
    line-height:1.05;
    margin:0 0 8px;
    letter-spacing:-0.5px;
  }
  .hero-meta{
    font-size:0.78rem;
    color:var(--text-dim);
    margin-bottom:16px;
    display:flex;
    gap:8px;
    align-items:center;
    flex-wrap:wrap;
  }
  .hero-meta span:not(:last-child)::after{content:"·"; margin-left:8px; color:var(--text-faint);}
  .hero-overview{
    font-size:0.85rem;
    color:var(--text-dim);
    line-height:1.5;
    max-width:560px;
    margin:0 0 18px;
    display:none;
  }
  .hero-overview.open{display:block;}
  .hero-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .btn{
    font-family:'Archivo', sans-serif;
    font-weight:700;
    font-size:0.78rem;
    letter-spacing:0.3px;
    padding:11px 20px;
    border-radius:6px;
    border:none;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .btn.primary{background:var(--accent); color:#fff;}
  .btn.primary:hover{background:var(--accent-hover);}
  .btn.ghost{background:rgba(255,255,255,0.08); color:var(--text); backdrop-filter:blur(6px);}
  .btn.ghost:hover{background:rgba(255,255,255,0.15);}
  .btn.pass{background:transparent; color:var(--pass); border:1px solid rgba(255,92,92,0.4);}
  .btn.pass:hover{background:rgba(255,92,92,0.1);}

  /* Rows */
  .row-block{margin-top:30px; padding-left:22px;}
  .row-title{
    font-size:0.72rem;
    font-weight:700;
    letter-spacing:1.2px;
    text-transform:uppercase;
    color:var(--text-faint);
    margin-bottom:12px;
  }
  .row-scroll{
    display:flex;
    gap:14px;
    overflow-x:auto;
    padding-right:22px;
    padding-bottom:6px;
  }
  .poster-card{
    flex:0 0 auto;
    width:150px;
    cursor:pointer;
  }
  .poster-img{
    width:150px;
    height:212px;
    border-radius:8px;
    background-size:cover;
    background-position:center;
    background-color:var(--bg-elev-2);
    position:relative;
    overflow:hidden;
    transition:transform 0.15s ease;
  }
  .poster-card:hover .poster-img{transform:scale(1.03);}
  .poster-tag{
    position:absolute;
    top:8px; left:8px;
    font-size:0.6rem;
    font-weight:700;
    letter-spacing:0.5px;
    text-transform:uppercase;
    background:rgba(10,10,12,0.75);
    color:var(--text);
    padding:3px 7px;
    border-radius:4px;
  }
  .poster-caption{
    margin-top:8px;
    font-size:0.78rem;
    font-weight:600;
    line-height:1.25;
    color:var(--text);
  }
  .poster-sub{
    font-size:0.68rem;
    color:var(--text-faint);
    margin-top:2px;
  }

  .empty-state, .loading-state{
    padding:80px 22px;
    text-align:center;
    color:var(--text-dim);
  }
  .empty-state .em-title, .loading-state .em-title{
    font-size:1.3rem;
    font-weight:800;
    color:var(--text);
    margin-bottom:8px;
  }

  /* Drawer */
  .drawer{
    position:fixed; top:0; right:0; height:100%; width:320px; max-width:88vw;
    background:var(--bg-elev);
    border-left:1px solid var(--line);
    transform:translateX(100%);
    transition:transform 0.25s ease;
    z-index:50; padding:22px; overflow-y:auto;
  }
  .drawer.open{transform:translateX(0);}
  .drawer h3{font-size:1.1rem; font-weight:800; margin:0 0 4px;}
  .drawer .close-drawer{
    background:none; border:none; color:var(--text-dim);
    font-size:1.2rem; cursor:pointer; float:right;
  }
  .match-item{display:flex; gap:10px; padding:12px 0; border-bottom:1px solid var(--line);}
  .match-item img{width:46px; height:65px; object-fit:cover; border-radius:5px;}
  .match-item .mi-title{font-size:0.82rem; color:var(--text); font-weight:700;}
  .match-item .mi-year{font-size:0.7rem; color:var(--text-faint); margin-top:3px;}

  footer{
    margin-top:40px;
    padding:0 22px;
    font-size:0.68rem;
    color:var(--text-faint);
    letter-spacing:0.3px;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo"><span class="dots"><span></span><span></span><span></span><span></span><span></span><span></span></span>ANIME MATCH</div>
  <button class="matches-btn" id="matchesBtn">★ <span id="matchCount">0</span></button>
</div>

<div class="filter-bar" style="flex-direction:column; align-items:flex-start; gap:12px;">
  <div>
    <div class="row-title" style="margin-bottom:8px;">¿Cómo te sientes? (elige una o varias)</div>
    <div class="mood-scroll" id="moodChips"></div>
  </div>
  <div>
    <div class="row-title" style="margin-bottom:8px;">Tipo de audiencia (opcional, combina con lo de arriba)</div>
    <div class="mood-scroll" id="demoChips"></div>
  </div>
</div>

<div class="filter-bar">
  <select id="decadeSelect">
    <option value="">Cualquier época</option>
    <option value="1980-01-01,1989-12-31">Años 80</option>
    <option value="1990-01-01,1999-12-31">Años 90</option>
    <option value="2000-01-01,2009-12-31">2000s</option>
    <option value="2010-01-01,2019-12-31">2010s</option>
    <option value="2020-01-01,2029-12-31">2020s</option>
  </select>
  <label class="toggle-wrap">
    <input type="checkbox" id="nicheToggle" checked>
    Priorizar nicho
  </label>
  <button class="go-btn" id="goBtn">Buscar</button>
</div>

<div id="mainArea">
  <div class="empty-state">
    <div class="em-title">Elige una sensación</div>
    Selecciona un mood arriba y presiona "Buscar".
  </div>
</div>

<div class="drawer" id="drawer">
  <button class="close-drawer" id="closeDrawer">✕</button>
  <h3>Tus matches</h3>
  <div id="matchList"></div>
</div>

<footer>ANIME MATCH · DATOS VÍA JIKAN (MYANIMELIST)</footer>

<script>
const MOODS = [
  { id:'melancolico', label:'Melancólico', genres:[8,40] },
  { id:'reconfortante', label:'Reconfortante', genres:[36,4] },
  { id:'tenso', label:'Tenso', genres:[41,7] },
  { id:'romantico', label:'Romántico', genres:[22] },
  { id:'nostalgico', label:'Nostálgico', genres:[36,8] },
  { id:'onirico', label:'Onírico / raro', genres:[37,24] },
  { id:'oscuro', label:'Oscuro', genres:[40,14] },
  { id:'esperanzador', label:'Esperanzador', genres:[8,1] },
];

const DEMOGRAPHICS = [
  { id:'shonen', label:'Shonen', genres:[27] },
  { id:'shojo', label:'Shojo', genres:[25] },
  { id:'seinen', label:'Seinen', genres:[42] },
  { id:'josei', label:'Josei', genres:[43] },
];

let currentDeck = [];
let matches = [];
let selectedMoods = [];
let selectedDemos = [];
let overviewOpen = false;

const $ = (sel) => document.querySelector(sel);

const chipRow = $('#moodChips');
MOODS.forEach(m => {
  const chip = document.createElement('button');
  chip.className = 'chip';
  chip.textContent = m.label;
  chip.dataset.id = m.id;
  chip.addEventListener('click', () => {
    chip.classList.toggle('active');
    if(chip.classList.contains('active')){
      selectedMoods.push(m);
    } else {
      selectedMoods = selectedMoods.filter(x => x.id !== m.id);
    }
  });
  chipRow.appendChild(chip);
});

const demoRow = $('#demoChips');
DEMOGRAPHICS.forEach(d => {
  const chip = document.createElement('button');
  chip.className = 'chip';
  chip.textContent = d.label;
  chip.dataset.id = d.id;
  chip.addEventListener('click', () => {
    chip.classList.toggle('active');
    if(chip.classList.contains('active')){
      selectedDemos.push(d);
    } else {
      selectedDemos = selectedDemos.filter(x => x.id !== d.id);
    }
  });
  demoRow.appendChild(chip);
});

$('#goBtn').addEventListener('click', () => {
  if(selectedMoods.length === 0){ alert('Elige al menos una sensación.'); return; }
  loadDeck();
});

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

async function jikanSearch(params){
  const url = new URL('https://api.jikan.moe/v4/anime');
  url.searchParams.set('sfw', 'true');
  Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));
  const res = await fetch(url);
  if(!res.ok) throw new Error('Jikan error ' + res.status);
  const json = await res.json();
  return json.data || [];
}

async function loadDeck(){
  $('#mainArea').innerHTML = '<div class="loading-state"><div class="em-title">Buscando...</div>Mezclando títulos conocidos con joyas escondidas.</div>';

  const decadeVal = $('#decadeSelect').value;
  const niche = $('#nicheToggle').checked;
  const moodGenreIds = selectedMoods.flatMap(m => m.genres);
  const demoGenreIds = selectedDemos.flatMap(d => d.genres);
  const genreIds = [...new Set([...moodGenreIds, ...demoGenreIds])];
  const genreStr = genreIds.join(',');
  const randomPagePopular = Math.floor(Math.random()*5)+1;
  const randomPageNiche = Math.floor(Math.random()*8)+1;

  let dateParams = {};
  if(decadeVal){
    const [start,end] = decadeVal.split(',');
    dateParams['start_date'] = start;
    dateParams['end_date'] = end;
  }

  try{
    const popularBatch = await jikanSearch({
      genres: genreStr, order_by:'members', sort:'desc',
      page: randomPagePopular, limit: 15, ...dateParams
    });
    await sleep(400);
    const nicheBatch = await jikanSearch({
      genres: genreStr, order_by:'score', sort:'desc',
      page: randomPageNiche, limit: 15, ...dateParams
    });

    const popularSlice = popularBatch.slice(0, niche ? 6 : 14);
    const nicheCandidates = nicheBatch.filter(a => (a.members||0) < 150000);
    const nicheSlice = nicheCandidates.slice(0, niche ? 14 : 6);
    let pool = [...popularSlice, ...nicheSlice];

    const seen = new Set();
    pool = pool.filter(a => {
      if(seen.has(a.mal_id)) return false;
      seen.add(a.mal_id);
      return a.images && a.images.jpg && a.images.jpg.large_image_url;
    });
    for(let i = pool.length -1; i>0; i--){
      const j = Math.floor(Math.random()*(i+1));
      [pool[i],pool[j]] = [pool[j],pool[i]];
    }

    currentDeck = pool.map(a => ({
      id:a.mal_id,
      title: a.title_english || a.title,
      year: a.year || (a.aired && a.aired.prop && a.aired.prop.from && a.aired.prop.from.year) || '—',
      overview: a.synopsis ? a.synopsis.slice(0,320) : 'Sin sinopsis disponible.',
      poster: a.images.jpg.large_image_url,
      posterLarge: (a.images.jpg.large_image_url || '').replace('l.jpg','l.jpg'),
      rating: a.score ? a.score.toFixed(1) : '—',
      genresLabel: (a.genres||[]).map(g=>g.name).slice(0,2).join(', '),
      niche: (a.members||0) < 150000
    }));

    if(currentDeck.length === 0){
      $('#mainArea').innerHTML = '<div class="empty-state"><div class="em-title">No encontré nada</div>Prueba con otra sensación o quita el filtro de época.</div>';
      return;
    }

    buildLayout();
    overviewOpen = false;
    render();
  }catch(err){
    $('#mainArea').innerHTML = `<div class="empty-state"><div class="em-title">Algo falló</div>Jikan puede estar limitando peticiones. Intenta de nuevo en unos segundos.</div>`;
  }
}

function buildLayout(){
  $('#mainArea').innerHTML = `
    <div class="hero" id="hero">
      <div class="hero-content">
        <div class="hero-eyebrow" id="heroEyebrow"></div>
        <h1 class="hero-title" id="heroTitle"></h1>
        <div class="hero-meta" id="heroMeta"></div>
        <p class="hero-overview" id="heroOverview"></p>
        <div class="hero-actions">
          <button class="btn primary" id="likeBtn">♥ ME GUSTA</button>
          <button class="btn ghost" id="infoBtn">MÁS INFO</button>
          <button class="btn pass" id="passBtn">✕ PASAR</button>
        </div>
      </div>
    </div>
    <div class="row-block">
      <div class="row-title">Cine de nicho para ti</div>
      <div class="row-scroll" id="rowNiche"></div>
    </div>
    <div class="row-block">
      <div class="row-title">Muy vistos en este mood</div>
      <div class="row-scroll" id="rowPopular"></div>
    </div>
  `;
  $('#likeBtn').addEventListener('click', () => decide(true));
  $('#passBtn').addEventListener('click', () => decide(false));
  $('#infoBtn').addEventListener('click', () => {
    overviewOpen = !overviewOpen;
    $('#heroOverview').classList.toggle('open', overviewOpen);
  });
}

function render(){
  if(currentDeck.length === 0){
    $('#mainArea').innerHTML = '<div class="empty-state"><div class="em-title">Eso es todo por ahora</div>Cambia la sensación o el filtro y busca de nuevo.</div>';
    return;
  }
  const top = currentDeck[0];
  const hero = $('#hero');
  hero.style.backgroundImage = `url('${top.poster}')`;
  $('#heroEyebrow').textContent = top.niche ? 'ANIME DE NICHO' : 'MUY VISTO';
  $('#heroTitle').textContent = top.title;
  $('#heroMeta').innerHTML = `<span>${top.year}</span><span>★ ${top.rating}</span><span>${top.genresLabel || 'Anime'}</span>`;
  $('#heroOverview').textContent = top.overview;
  $('#heroOverview').classList.toggle('open', overviewOpen);

  const rest = currentDeck.slice(1);
  renderRow('rowNiche', rest.filter(a => a.niche).slice(0,10));
  renderRow('rowPopular', rest.filter(a => !a.niche).slice(0,10));
}

function renderRow(elId, items){
  const el = $('#' + elId);
  el.innerHTML = '';
  if(items.length === 0){
    el.innerHTML = '<div style="color:var(--text-faint); font-size:0.78rem;">Nada por aquí todavía — sigue deslizando.</div>';
    return;
  }
  items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'poster-card';
    card.innerHTML = `
      <div class="poster-img" style="background-image:url('${item.poster}')">
        <div class="poster-tag">${item.niche ? 'NICHO' : 'POPULAR'}</div>
      </div>
      <div class="poster-caption">${item.title}</div>
      <div class="poster-sub">${item.year} · ★ ${item.rating}</div>
    `;
    card.addEventListener('click', () => {
      const idx = currentDeck.findIndex(d => d.id === item.id);
      if(idx > 0){
        const [picked] = currentDeck.splice(idx,1);
        currentDeck.unshift(picked);
        overviewOpen = false;
        render();
        window.scrollTo({top:0, behavior:'smooth'});
      }
    });
    el.appendChild(card);
  });
}

function decide(liked){
  if(currentDeck.length === 0) return;
  const top = currentDeck[0];
  if(liked){
    matches.push(top);
    $('#matchCount').textContent = matches.length;
    renderMatches();
  }
  currentDeck.shift();
  overviewOpen = false;
  render();
}

function renderMatches(){
  const list = $('#matchList');
  list.innerHTML = '';
  matches.slice().reverse().forEach(a => {
    const item = document.createElement('div');
    item.className = 'match-item';
    item.innerHTML = `
      <img src="${a.poster||''}" alt="">
      <div>
        <div class="mi-title">${a.title}</div>
        <div class="mi-year">${a.year}</div>
      </div>
    `;
    list.appendChild(item);
  });
}

$('#matchesBtn').addEventListener('click', () => $('#drawer').classList.add('open'));
$('#closeDrawer').addEventListener('click', () => $('#drawer').classList.remove('open'));
</script>
</body>
</html>
