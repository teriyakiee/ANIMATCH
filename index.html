<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Vibe - Recomendador</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --accent: #2563eb;
      --card-bg: #f9f9f9;
      --border: #e5e5e5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }

    header { text-align: center; margin-bottom: 25px; }
    h1 { font-weight: 800; letter-spacing: -1px; font-size: 2rem; margin-bottom: 10px; }

    /* Filtros por Emoción */
    .filters { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 30px; }
    .filter-btn {
      padding: 8px 18px; border: 1px solid var(--border); background: #fff;
      border-radius: 20px; cursor: pointer; font-weight: 500; font-size: 0.9rem;
      transition: all 0.2s ease;
    }
    .filter-btn.active, .filter-btn:hover { background: #111; color: #fff; border-color: #111; }

    /* Contenedor de Cartas estilo Tinder Central */
    .card-container {
      width: 320px; height: 480px; position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }

    .card {
      width: 100%; height: 100%; background: var(--card-bg);
      border-radius: 16px; border: 1px solid var(--border);
      overflow: hidden; display: flex; flex-direction: column;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05); cursor: pointer; position: relative;
    }

    .card-img { width: 100%; height: 75%; object-fit: cover; }
    .card-info { padding: 15px; text-align: center; }
    .card-title { font-size: 1.1rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Botones de Acción */
    .actions { display: flex; gap: 20px; margin-top: 20px; }
    .btn-action {
      width: 55px; height: 55px; border-radius: 50%; border: 1px solid var(--border);
      background: #fff; font-size: 1.2rem; cursor: pointer; display: flex;
      align-items: center; justify-content: center; transition: transform 0.2s;
    }
    .btn-action:hover { transform: scale(1.1); }
    .btn-pass { color: #ef4444; }
    .btn-like { color: #10b981; }

    /* Modal Estilo MUBI (Vista Expandida) */
    .modal {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(255,255,255,0.98); display: none;
      align-items: center; justify-content: center; padding: 40px; z-index: 100;
    }
    .modal.open { display: flex; }
    .modal-content {
      max-width: 900px; width: 100%; display: grid; grid-template-columns: 1fr 1fr;
      gap: 40px; position: relative; background: #fff; padding: 20px;
    }
    .modal-close {
      position: absolute; top: -20px; right: 0; font-size: 2rem;
      cursor: pointer; background: none; border: none;
    }

    .details-left { display: flex; flex-direction: column; justify-content: center; }
    .stars { color: #f59e0b; margin: 10px 0; font-weight: bold; }
    .synopsis { font-size: 0.95rem; line-height: 1.6; color: #444; margin-bottom: 20px; }
    .platforms { display: flex; gap: 10px; align-items: center; margin-top: 15px; }
    .platform-tag {
      padding: 5px 12px; background: #f1f5f9; border-radius: 6px;
      font-size: 0.8rem; font-weight: 600; color: #334155;
    }

    .details-right img { width: 100%; max-height: 500px; border-radius: 12px; object-fit: cover; }
  </style>
</head>
<body>

  <header>
    <h1>¿Cómo te sientes hoy?</h1>
    <p style="color: #666; font-size: 0.9rem;">Elige una emoción y encuentra tu próximo anime.</p>
  </header>

  <div class="filters">
    <button class="filter-btn active" onclick="loadAnimes(22)">Romántico</button>
    <button class="filter-btn" onclick="loadAnimes(8)">Melancólico</button>
    <button class="filter-btn" onclick="loadAnimes(1)">Con Energía</button>
    <button class="filter-btn" onclick="loadAnimes(36)">Tranquilo / Relajado</button>
    <button class="filter-btn" onclick="loadAnimes(4)">Risas</button>
  </div>

  <div class="card-container">
    <div class="card" id="animeCard" onclick="openModal()">
      <img src="" id="cardImg" class="card-img" alt="Portada">
      <div class="card-info">
        <div class="card-title" id="cardTitle">Cargando...</div>
      </div>
    </div>
  </div>

  <div class="actions">
    <button class="btn-action btn-pass" onclick="nextCard()">✕</button>
    <button class="btn-action btn-like" onclick="nextCard()">♥</button>
  </div>

  <!-- Vista MUBI Expandida -->
  <div class="modal" id="detailModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">×</button>
      <div class="details-left">
        <h2 id="modalTitle" style="font-size: 1.8rem;">Título Anime</h2>
        <div class="stars" id="modalStars">★ 8.5 / 10</div>
        <p class="synopsis" id="modalSynopsis">Cargando sinopsis...</p>
        <div>
          <strong style="font-size: 0.85rem; color: #888;">DISPONIBLE EN:</strong>
          <div class="platforms" id="modalPlatforms">
            <span class="platform-tag">Crunchyroll</span>
            <span class="platform-tag">MyAnimeList</span>
          </div>
        </div>
      </div>
      <div class="details-right">
        <img id="modalImg" src="" alt="Portada Grande">
      </div>
    </div>
  </div>

  <script>
    let animeList = [];
    let currentIndex = 0;

    // Conexión gratuita con Jikan API (MyAnimeList)
    async function loadAnimes(genreId) {
      document.getElementById('cardTitle').innerText = "Buscando animes...";
      try {
        const response = await fetch(`https://api.jikan.moe/v4/anime?genres=${genreId}&order_by=score&sort=desc&limit=25`);
        const data = await response.json();
        animeList = data.data;
        currentIndex = 0;
        showCard();
      } catch (err) {
        document.getElementById('cardTitle').innerText = "Error cargando datos.";
      }
    }

    function showCard() {
      if (!animeList.length || currentIndex >= animeList.length) {
        document.getElementById('cardTitle').innerText = "¡No hay más opciones por ahora!";
        return;
      }
      const anime = animeList[currentIndex];
      document.getElementById('cardImg').src = anime.images.jpg.large_image_url;
      document.getElementById('cardTitle').innerText = anime.title;
    }

    function nextCard() {
      currentIndex++;
      showCard();
    }

    function openModal() {
      const anime = animeList[currentIndex];
      if (!anime) return;

      document.getElementById('modalTitle').innerText = anime.title;
      document.getElementById('modalImg').src = anime.images.jpg.large_image_url;
      document.getElementById('modalStars').innerText = `★ ${(anime.score || 7.0).toFixed(1)} / 10`;
      
      // Sinopsis abreviada
      const shortSynopsis = anime.synopsis 
        ? anime.synopsis.slice(0, 300) + '...' 
        : 'Sin descripción disponible por el momento.';
      document.getElementById('modalSynopsis').innerText = shortSynopsis;

      document.getElementById('detailModal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('detailModal').classList.remove('open');
    }

    // Cargar por defecto la primera emoción
    loadAnimes(22);
  </script>
</body>
</html>
